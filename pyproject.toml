[project]
name = "ai-qa"
version = "0.1.0"
description = "AI-assisted QA automation platform"
readme = "README.md"
# Exact pin: ">=3.12" would resolve against a newer system interpreter and
# silently defeat FR-002. uv provisions this version (see .python-version).
requires-python = "==3.12.*"
dependencies = [
    "allure-pytest>=2.16.2",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --strict-markers is load-bearing: without it a mistyped `-m healthchek`
# runs zero tests and exits 0, which would make the verification gate
# report success on a broken environment (FR-016, R8).
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--alluredir=reports/allure-results",
    "--output=reports/artifacts",
    "--screenshot=only-on-failure",
    "--video=retain-on-failure",
    "--tracing=retain-on-failure",
]

markers = [
    "healthcheck: verifies the development environment itself (FR-019)",
    "ui: browser-driven test",
    "api: service/API test",
    "smoke: minimal critical-path subset",
    "jira: exercises the Jira REST integration (feature 002)",
    "ticket(key): links a test to its source ticket (feature 003/005)",
]
